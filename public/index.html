<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<title>Scout — AI Browser Agent</title>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f7f7f8; --panel: #ffffff; --border: #e6e6e9;
    --text: #1f2023; --muted: #6b6f76; --faint: #9aa0a8;
    --accent: #5b5bd6; --accent-soft: #eeeefb; --accent-text: #ffffff;
    --user-bg: #5b5bd6; --user-text: #ffffff;
    --ok: #1a8f4c; --ok-soft: #e7f6ed; --bad: #c33a3a; --bad-soft: #fbeaea;
    --warn: #9a6a00; --warn-soft: #fdf4e0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1b1e; --bg-soft: #202226; --panel: #25262b; --border: #33353b;
      --text: #ececee; --muted: #a0a4ad; --faint: #767a83;
      --accent: #8f8ff0; --accent-soft: #2b2b3a;
      --user-bg: #5b5bd6; --user-text: #ffffff;
      --ok: #4cc47d; --ok-soft: #16331f; --bad: #f08a8a; --bad-soft: #341a1a;
      --warn: #e0b45a; --warn-soft: #2e2713;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, #6b6bf0, #9b6bf0); color: #fff; font-size: 16px;
  }
  .badge {
    font-size: 12px; color: var(--muted); background: var(--bg-soft);
    border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; font-weight: 500;
  }
  .spacer { flex: 1; }
  .status-pill {
    display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted);
    padding: 5px 11px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); transition: .2s; }
  .dot.ready { background: var(--ok); }
  .dot.working { background: var(--warn); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .icon-btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: 16px;
    display: grid; place-items: center; transition: .15s;
  }
  .icon-btn:hover { background: var(--bg-soft); }

  /* ── Options drawer ── */
  .options {
    display: none; gap: 16px; align-items: center; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-soft);
  }
  .options.open { display: flex; }
  .options label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .options input[type=text] {
    padding: 7px 11px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--panel); color: var(--text); font-size: 14px; min-width: 240px;
  }
  .switch { position: relative; width: 38px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: .2s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  /* ── Conversation ── */
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .thread { max-width: 760px; margin: 0 auto; padding: 28px 20px 16px; }

  .welcome { text-align: center; padding: 56px 0 24px; color: var(--muted); }
  .welcome .logo { width: 52px; height: 52px; border-radius: 15px; font-size: 26px; margin: 0 auto 16px; }
  .welcome h1 { font-size: 22px; color: var(--text); margin: 0 0 6px; font-weight: 650; }
  .welcome p { margin: 0 auto; max-width: 440px; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 540px; margin: 26px auto 0; }
  .suggestion {
    text-align: left; border: 1px solid var(--border); background: var(--panel); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; font-size: 13.5px; color: var(--text); transition: .15s;
  }
  .suggestion:hover { border-color: var(--accent); background: var(--accent-soft); }
  .suggestion b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }

  .turn { display: flex; gap: 12px; margin: 22px 0; align-items: flex-start; }
  .turn.user { flex-direction: row-reverse; }
  .avatar {
    flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    font-size: 15px; margin-top: 2px;
  }
  .avatar.bot { background: linear-gradient(135deg, #6b6bf0, #9b6bf0); color: #fff; }
  .avatar.me { background: var(--bg-soft); border: 1px solid var(--border); }
  .turn-body { min-width: 0; max-width: 100%; }

  .bubble {
    padding: 11px 15px; border-radius: 14px; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
  }
  .user .bubble { background: var(--user-bg); color: var(--user-text); border-top-right-radius: 5px; }
  .answer {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; border-top-left-radius: 5px;
    padding: 13px 16px; box-shadow: var(--shadow); font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
  }
  .answer.error { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  /* Rich markdown answer — Claude/ChatGPT-like typography */
  .answer { line-height: 1.65; }
  .answer > *:first-child { margin-top: 0; }
  .answer > *:last-child { margin-bottom: 0; }
  .answer p { margin: 10px 0; }
  .answer h1, .answer h2, .answer h3, .answer h4 { margin: 18px 0 8px; line-height: 1.3; font-weight: 650; }
  .answer h1 { font-size: 20px; } .answer h2 { font-size: 18px; } .answer h3 { font-size: 16px; } .answer h4 { font-size: 15px; }
  .answer ul, .answer ol { margin: 8px 0; padding-left: 22px; }
  .answer li { margin: 4px 0; }
  .answer li > ul, .answer li > ol { margin: 4px 0; }
  .answer a { color: var(--accent); text-decoration: none; }
  .answer a:hover { text-decoration: underline; }
  .answer strong, .answer b { font-weight: 650; }
  .answer code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
  .answer pre { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; overflow-x: auto; margin: 12px 0; }
  .answer pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.5; }
  .answer blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--border); color: var(--muted); }
  .answer hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .answer table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13.5px; display: block; overflow-x: auto; }
  .answer th, .answer td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
  .answer th { background: var(--bg-soft); font-weight: 650; }
  .answer tr:nth-child(even) td { background: color-mix(in srgb, var(--bg-soft) 50%, transparent); }
  .answer img { max-width: 100%; border-radius: 8px; }

  /* work log */
  .worklog { border: 1px solid var(--border); border-radius: 14px; background: var(--bg-soft); overflow: hidden; margin-bottom: 10px; }
  .worklog-head {
    display: flex; align-items: center; gap: 9px; padding: 9px 13px; font-size: 13px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .worklog-head .chev { margin-left: auto; transition: .2s; color: var(--faint); }
  .worklog.collapsed .steps { display: none; }
  .worklog.collapsed .chev { transform: rotate(-90deg); }
  .mini-spinner {
    width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .steps { padding: 2px 13px 10px; display: flex; flex-direction: column; gap: 2px; }
  .step { display: flex; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--border); }
  .step:first-child { border-top: none; }
  .step-num {
    flex: none; width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); color: var(--accent);
    font-size: 11px; font-weight: 700; display: grid; place-items: center; margin-top: 1px;
  }
  .step-main { min-width: 0; flex: 1; }
  .step-thought { font-size: 13.5px; color: var(--text); }
  .chip {
    display: inline-block; margin-top: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px;
  }
  .step-result { margin-top: 4px; font-size: 12.5px; }
  .step-result.ok { color: var(--ok); } .step-result.bad { color: var(--bad); }

  .live {
    display: flex; align-items: center; gap: 9px; padding: 10px 14px; font-size: 13.5px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 14px; border-top-left-radius: 5px; background: var(--panel);
  }

  /* confirm card */
  .confirm { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 14px; padding: 12px 15px; margin-top: 8px; }
  .confirm .t { font-size: 13px; color: var(--warn); font-weight: 600; margin-bottom: 8px; }
  .confirm .chip { color: var(--warn); background: #fff6; }
  .confirm-btns { display: flex; gap: 8px; margin-top: 10px; }

  /* ── Composer ── */
  .composer-wrap { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px 16px; }
  .composer { max-width: 760px; margin: 0 auto; }
  .work-strip {
    display: none; align-items: center; gap: 10px; margin-bottom: 10px; padding: 9px 14px;
    background: var(--accent-soft); border-radius: 11px; font-size: 13.5px; color: var(--accent);
  }
  .work-strip.show { display: flex; }
  .typing { display: inline-flex; gap: 3px; }
  .typing span { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

  .input-row {
    display: flex; align-items: flex-end; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 8px 8px 16px; background: var(--panel); box-shadow: var(--shadow); transition: border-color .15s;
  }
  .input-row:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent; color: var(--text);
    font: inherit; max-height: 160px; padding: 7px 0; line-height: 1.5;
  }
  .send {
    flex: none; width: 38px; height: 38px; border-radius: 11px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 17px; display: grid; place-items: center; transition: .15s;
  }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .send.stop { background: var(--bad); }
  .foot { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 9px; }
  button.primary, button.ghost { font: inherit; font-weight: 600; border-radius: 9px; padding: 7px 15px; cursor: pointer; font-size: 13px; }
  button.primary { background: var(--accent); color: #fff; border: none; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="icon.svg" alt="Scout" style="padding:0;background:none" /> Scout</div>
  <span class="badge" id="modelBadge">connecting…</span>
  <span class="spacer"></span>
  <span class="status-pill"><span class="dot" id="dot"></span><span id="statusTxt">Ready</span></span>
  <button class="icon-btn" id="gear" title="Options">⚙</button>
</header>

<div class="options" id="options">
  <label>Start URL <input type="text" id="url" placeholder="https://… (optional)" /></label>
  <label><span class="switch"><input type="checkbox" id="auto" checked /><span class="slider"></span></span> Auto mode (don't ask before each action)</label>
  <label><span class="switch"><input type="checkbox" id="cdp" /><span class="slider"></span></span> Use my main Chrome (CDP :9222)</label>
</div>

<main id="main">
  <div class="thread" id="thread">
    <div class="welcome" id="welcome">
      <img class="logo" src="icon.svg" alt="Scout" style="padding:0;background:none" />
      <h1>Hi, I'm Scout</h1>
      <p>Tell me to open a site or find something, and I'll go to a real browser, read the page, and bring back the details.</p>
      <div class="suggestions" id="suggestions">
        <button class="suggestion" data-q="Search for the weather in Dhaka today and tell me the temperature and conditions"><b>Research</b>Check today's weather in Dhaka</button>
        <button class="suggestion" data-q="Go to news.ycombinator.com and summarize the top 3 stories"><b>Summarize</b>Top 3 Hacker News stories</button>
        <button class="suggestion" data-q="Search Google for the current USD to BDT exchange rate and report it"><b>Look up</b>USD → BDT exchange rate</button>
        <button class="suggestion" data-q="Go to wikipedia.org and tell me the featured article of the day"><b>Browse</b>Wikipedia article of the day</button>
      </div>
    </div>
  </div>
</main>

<div class="composer-wrap">
  <div class="composer">
    <div class="work-strip" id="workStrip">
      <span class="typing"><span></span><span></span><span></span></span>
      <span id="workText">Working…</span>
    </div>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Message the agent… (e.g. search flights to Dubai)"></textarea>
      <button class="send" id="send" title="Send">➤</button>
    </div>
    <div class="foot">The agent drives a real Chrome window. Nothing is sent anywhere except page text to the model.</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const thread = $('thread');
const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let running = false, turn = null;

// ── model badge ──
fetch('/config').then(r => r.json()).then(c => {
  $('modelBadge').textContent = `${c.provider} · ${c.model}`;
}).catch(() => { $('modelBadge').textContent = 'offline'; });

// ── options drawer ──
$('gear').onclick = () => $('options').classList.toggle('open');

// ── status ──
function setStatus(state, text) {
  $('dot').className = 'dot ' + state;
  $('statusTxt').textContent = text;
}
function setWorking(on) {
  running = on;
  $('send').classList.toggle('stop', on);
  $('send').title = on ? 'Stop' : 'Send';
  $('send').innerHTML = on ? '■' : '➤';
  $('workStrip').classList.toggle('show', on);
  setStatus(on ? 'working' : 'ready', on ? 'Working…' : 'Ready');
}
function liveText(t) { $('workText').textContent = t; if (turn?.live) turn.live.querySelector('.lt').textContent = t; }

function scrollDown() { $('main').scrollTop = $('main').scrollHeight; }

// ── render helpers ──
function addUser(text) {
  $('welcome')?.remove();
  const el = document.createElement('div');
  el.className = 'turn user';
  el.innerHTML = `<div class="avatar me">🧑</div><div class="turn-body"><div class="bubble">${esc(text)}</div></div>`;
  thread.appendChild(el); scrollDown();
}

function startAssistantTurn() {
  const el = document.createElement('div');
  el.className = 'turn';
  el.innerHTML = `
    <div class="avatar bot"><img src="icon.svg" alt="" style="width:20px;height:20px" /></div>
    <div class="turn-body">
      <div class="worklog" id="wl">
        <div class="worklog-head"><span class="mini-spinner" id="wlspin"></span><span id="wltitle">Working on it…</span><span class="chev">▾</span></div>
        <div class="steps" id="steps"></div>
      </div>
      <div class="live"><span class="mini-spinner"></span><span class="lt">Starting…</span></div>
    </div>`;
  thread.appendChild(el);
  const steps = el.querySelector('#steps');
  const wl = el.querySelector('#wl');
  wl.querySelector('.worklog-head').onclick = () => wl.classList.toggle('collapsed');
  turn = { el, steps, wl, live: el.querySelector('.live'), stepEls: {}, count: 0 };
  scrollDown();
}

function ensureStep(n) {
  if (turn.stepEls[n]) return turn.stepEls[n];
  const row = document.createElement('div');
  row.className = 'step';
  row.innerHTML = `<div class="step-num">${n}</div><div class="step-main"><div class="step-thought"></div></div>`;
  turn.steps.appendChild(row);
  turn.stepEls[n] = row; turn.count = n;
  return row;
}

function render(ev) {
  switch (ev.kind) {
    case 'activity':
      liveText(ev.text);
      break;
    case 'observation':
      liveText(`Reading page — ${ev.title || ev.url}`);
      break;
    case 'plan': {
      const row = ensureStep(ev.step);
      const main = row.querySelector('.step-main');
      main.querySelector('.step-thought').textContent = ev.thought || describe(ev.action);
      if (!main.querySelector('.chip')) {
        const chip = document.createElement('div');
        chip.className = 'chip';
        main.appendChild(chip);
      }
      main.querySelector('.chip').textContent = describe(ev.action);
      scrollDown();
      break;
    }
    case 'result': {
      const row = turn.stepEls[ev.step]; if (!row) break;
      let r = row.querySelector('.step-result');
      if (!r) { r = document.createElement('div'); r.className = 'step-result'; row.querySelector('.step-main').appendChild(r); }
      r.className = 'step-result ' + (ev.ok ? 'ok' : 'bad');
      r.textContent = (ev.ok ? '✓ ' : '✗ ') + ev.text;
      break;
    }
    case 'awaiting_confirm': {
      const card = document.createElement('div');
      card.className = 'confirm';
      card.innerHTML = `<div class="t">Approve this action?</div><div class="chip">${esc(describe(ev.action))}</div>
        <div class="confirm-btns"><button class="primary">Approve</button><button class="ghost">Skip</button></div>`;
      const [ok, skip] = card.querySelectorAll('button');
      ok.onclick = () => { control('approve'); card.querySelectorAll('button').forEach(b=>b.disabled=true); };
      skip.onclick = () => { control('reject'); card.querySelectorAll('button').forEach(b=>b.disabled=true); };
      turn.live.before(card); scrollDown();
      break;
    }
    case 'captcha': {
      liveText('🛡️ Waiting for you to solve the verification…');
      const c = document.createElement('div');
      c.className = 'confirm';
      c.innerHTML = `<div class="t">🛡️ Human verification needed</div><div>${esc(ev.text)}</div>`;
      turn.live.before(c); scrollDown();
      break;
    }
    case 'login': {
      liveText('🔑 Waiting for you to sign in…');
      const c = document.createElement('div');
      c.className = 'confirm';
      c.innerHTML = `<div class="t">🔑 Sign-in needed</div><div>${esc(ev.text)}</div>
        <div class="confirm-btns"><button class="primary">I've signed in — continue</button></div>`;
      c.querySelector('button').onclick = (e) => { control('continue'); e.target.disabled = true; e.target.textContent = 'Continuing…'; };
      turn.live.before(c); scrollDown();
      break;
    }
    case 'finished':
      finishTurn();
      addAnswer(ev.answer);
      break;
    case 'error':
      finishTurn();
      addAnswer(ev.text, true);
      break;
    case 'idle':
      setWorking(false);
      break;
  }
}

function finishTurn() {
  if (!turn) return;
  turn.live?.remove();
  const spin = turn.el.querySelector('#wlspin'); if (spin) spin.replaceWith(Object.assign(document.createElement('span'), { textContent: '✓' }));
  const t = turn.el.querySelector('#wltitle'); if (t) t.textContent = `Worked for ${turn.count} step${turn.count===1?'':'s'}`;
  turn.wl.classList.add('collapsed');
}
// Rich Markdown via marked + DOMPurify (like Claude/ChatGPT). Falls back to
// the tiny parser below if the CDN libraries didn't load.
if (window.DOMPurify) {
  DOMPurify.addHook('afterSanitizeAttributes', (n) => {
    if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); }
  });
}
function renderMarkdown(src) {
  if (window.marked && window.DOMPurify) {
    try {
      const html = marked.parse(String(src || ''), { gfm: true, breaks: true });
      return DOMPurify.sanitize(html);
    } catch {}
  }
  return mdLite(src);
}

// Minimal, safe Markdown fallback: escape first, then apply bold, links, bullets.
function mdLite(src) {
  let s = esc(src || '(no answer)');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const lines = s.split('\n');
  let html = '', inList = false;
  for (const ln of lines) {
    const m = ln.match(/^\s*[-*]\s+(.*)$/);
    if (m) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${m[1]}</li>`; }
    else { if (inList) { html += '</ul>'; inList = false; } if (ln.trim()) html += `<div>${ln}</div>`; }
  }
  if (inList) html += '</ul>';
  return html;
}

function addAnswer(text, isError) {
  if (!turn) return;
  const a = document.createElement('div');
  a.className = 'answer' + (isError ? ' error' : '');
  if (isError) a.textContent = text || '(no answer)';
  else a.innerHTML = renderMarkdown(text);
  turn.el.querySelector('.turn-body').appendChild(a);
  scrollDown();
}

function describe(a) {
  if (!a) return '';
  switch (a.type) {
    case 'navigate': return `open ${a.url}`;
    case 'click': return `click [${a.id}]`;
    case 'type': return `type "${(a.text||'').slice(0,40)}"${a.submit?' ⏎':''}`;
    case 'press': return `press ${a.key}`;
    case 'scroll': return `scroll ${a.direction||'down'}`;
    case 'wait': return 'wait';
    case 'done': return 'finish';
    default: return a.type || '';
  }
}

async function control(command) {
  await fetch('/control', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ command }) });
}

async function run() {
  const task = $('input').value.trim();
  if (!task || running) return;
  $('input').value = ''; autosize();
  addUser(task);
  setWorking(true);
  startAssistantTurn();
  const res = await fetch('/run', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      task,
      startUrl: $('url').value.trim() || undefined,
      auto: $('auto').checked,
      mode: $('cdp').checked ? 'cdp' : 'profile',
    }),
  });
  if (!res.ok) {
    const e = await res.json().catch(()=>({}));
    finishTurn(); addAnswer(e.error || 'Failed to start', true); setWorking(false);
  }
}

// composer behavior
function autosize() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }
$('input').addEventListener('input', autosize);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); running ? control('stop') : run(); }
});
$('send').onclick = () => running ? control('stop') : run();
document.querySelectorAll('.suggestion').forEach(b => b.onclick = () => { $('input').value = b.dataset.q; autosize(); run(); });

// event stream
const streamEvents = new EventSource('/events');
streamEvents.onmessage = (m) => { try { render(JSON.parse(m.data)); } catch {} };
streamEvents.onopen = () => setStatus('ready', 'Ready');
streamEvents.onerror = () => setStatus('', 'Reconnecting…');
setStatus('ready', 'Ready');
</script>
